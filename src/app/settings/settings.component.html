<div class="dashboard">

    <!-- Sidebar -->
    <div class="sidebar">
        <h2>AI Employee</h2>
        <ul>
            <li (click)="Dashboard()">🏠 Dashboard</li>
            <li (click)="Chat()">💬 Chat</li>
            <li>📊 Leads</li>
            <li>📁 Documents</li>
            <li>🎙 Voice</li>
            <li class="active">⚙ Settings</li>
        </ul>
        <button class="logout-btn" (click)="logout()">Logout</button>
    </div>

    <!-- Main Content -->
    <div class="main">

        <!-- Topbar -->
        <div class="topbar">
            <h3>Settings ⚙️</h3>
            <div class="profile">👤 {{ user?.name }}</div>
        </div>

        <!-- Saving/Translating Loader -->
        <div class="translate-overlay" *ngIf="isSaving">
            <div class="translate-box">
                <div class="spinner"></div>
                <p>🌐 Translating & Saving... please wait</p>
            </div>
        </div>

        <!-- Language Settings -->
        <div class="settings-box">
            <h4>🌐 Language</h4>
            <p class="settings-sub">Choose your preferred language for the app</p>

            <div class="lang-options">
                <div class="lang-card" [class.selected-lang]="selectedLang === 'en'"
                    (click)="selectLang('en')">
                    <span class="lang-flag">🇬🇧</span>
                    <span class="lang-name">English</span>
                    <span class="lang-check" *ngIf="selectedLang === 'en'">✅</span>
                </div>

                <div class="lang-card" [class.selected-lang]="selectedLang === 'ta'"
                    (click)="selectLang('ta')">
                    <span class="lang-flag">🇮🇳</span>
                    <span class="lang-name">தமிழ் (Tamil)</span>
                    <span class="lang-check" *ngIf="selectedLang === 'ta'">✅</span>
                </div>
            </div>

            <button class="btn-save" (click)="saveSettings()" [disabled]="isSaving">
                {{ isSaving ? '⏳ Translating...' : '💾 Save Settings' }}
            </button>
        </div>

    </div>
</div>
