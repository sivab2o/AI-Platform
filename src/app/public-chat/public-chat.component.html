<div class="public-chat-wrapper">
    <div class="chat-wrapper">

        <!-- ✅ Step 1: Guest Form FIRST -->
        <div class="guest-form" *ngIf="collectingInfo && !showLangSelect && !formSubmitted && step === 'form'">
            <div class="guest-form-body">
                <p class="form-title">Welcome! Enter your details to start chatting</p>
                <div class="form-group">
                    <label>Full Name *</label>
                    <input type="text" [(ngModel)]="guestName" placeholder="Enter your name" />
                </div>
                <div class="form-group">
                    <label>Mobile Number *</label>
                    <input type="tel" [(ngModel)]="guestMobile" placeholder="Enter 10-digit mobile number"
                        maxlength="10" />
                </div>
                <button class="btn-start-chat" (click)="goToLangSelect()">
                    Next ➤
                </button>
            </div>
        </div>

        <!-- ✅ Step 2: Language Selection SECOND -->
        <div class="lang-select-screen" *ngIf="collectingInfo && showLangSelect">
            <div class="lang-select-body">
                <div class="lang-icon">🌐</div>
                <h3 class="lang-select-title">Choose Your Language</h3>
                <p class="lang-select-sub">Select the language you want to chat in</p>
                <div class="lang-grid">
                    <button class="lang-card" *ngFor="let lang of languages" (click)="selectLanguage(lang)">
                        <span class="lang-flag">{{ lang.flag }}</span>
                        <span class="lang-name">{{ lang.name }}</span>
                    </button>
                </div>
                <button class="btn-back-form" (click)="showLangSelect = false">← Back</button>
            </div>
        </div>

        <!-- ✅ Step 3: Chat -->
        <ng-container *ngIf="!collectingInfo">
            <div class="chat-messages" #chatMessages>

                <ng-container *ngFor="let msg of messages">
                    <div class="user-msg-wrapper" *ngIf="msg.sender === 'user'">
                        <div class="user-msg">
                            <p>{{ msg.text }}</p>
                            <span class="msg-time">{{ msg.time }}</span>
                        </div>
                        <div class="avatar">👤</div>
                    </div>
                    <div class="bot-msg-wrapper" *ngIf="msg.sender === 'bot'">
                        <div class="avatar">🤖</div>
                        <div class="bot-msg">
                            <p>{{ msg.text }}</p>
                            <span class="msg-time">{{ msg.time }}</span>
                        </div>
                    </div>
                </ng-container>

                <!-- ✅ Quick replies -->
                <div class="quick-replies-chat" *ngIf="showQuickReplies && quickReplies.length > 0">
                    <p class="quick-label">💡 You can also ask:</p>
                    <div class="quick-buttons">
                        <button class="quick-btn" *ngFor="let q of quickReplies" (click)="sendQuickReply(q)">
                            {{ q }}
                        </button>
                    </div>
                </div>



                <!-- Typing indicator -->
                <div class="bot-msg-wrapper" *ngIf="isTyping">
                    <div class="avatar">🤖</div>
                    <div class="bot-msg typing">
                        <span></span><span></span><span></span>
                    </div>
                </div>

            </div>

            <!-- ✅ Fix 1: Listening indicator -->
            <!-- ✅ Voice status indicator — listening waves / speaking pulse -->
            <div class="voice-status" *ngIf="isMicActive && !isTyping && !isSpeaking">
                <div class="wave-bars">
                    <span class="bar" [style.height.px]="6 + micLevel * 6"></span>
                    <span class="bar" [style.height.px]="6 + micLevel * 8"></span>
                    <span class="bar" [style.height.px]="6 + micLevel * 14"></span>
                    <span class="bar" [style.height.px]="6 + micLevel * 20"></span>
                    <span class="bar" [style.height.px]="6 + micLevel * 26"></span>
                    <span class="bar" [style.height.px]="6 + micLevel * 30"></span>
                    <span class="bar" [style.height.px]="6 + micLevel * 26"></span>
                    <span class="bar" [style.height.px]="6 + micLevel * 20"></span>
                    <span class="bar" [style.height.px]="6 + micLevel * 14"></span>
                    <span class="bar" [style.height.px]="6 + micLevel * 8"></span>
                    <span class="bar" [style.height.px]="6 + micLevel * 6"></span>
                </div>
            </div>

            <div class="voice-status speaking" *ngIf="isSpeaking">
                <div class="speak-pulse">
                    <span class="pulse-ring"></span>
                    <span class="pulse-core">🔊</span>
                </div>
                <span class="voice-status-text">✨ Answering you...</span>
            </div>

            <div class="chat-input-box">
                <input type="text" [(ngModel)]="userMessage" (keyup.enter)="sendMessage()"
                    placeholder="{{ isListening ? 'Listening... speak now 🎙️' : 'You can talk or type now...' }}"
                    [disabled]="isTyping" />

                <!-- ✅ Stop speaking button -->
                <button class="stop-speak-btn" *ngIf="isSpeaking" (click)="stopSpeaking()" title="Stop speaking">
                    🔊
                </button>

                <!-- ✅ Mic button -->
                <button class="voice-input-btn" (click)="startVoiceInput()" [class.listening]="isMicActive"
                    [class.not-listening]="!isMicActive" [disabled]="isTyping"
                    title="{{ isMicActive ? 'Stop listening' : 'Click to speak' }}">
                    🎤
                </button>

                <!-- ✅ Send button -->
                <button class="send-btn" (click)="sendMessage()" [disabled]="isTyping || !userMessage.trim()">➤</button>

                <!-- ✅ Close button -->
                <button class="close-btn" (click)="closeChat()" title="Close chat">✕</button>
            </div>
        </ng-container>

    </div>
</div>
